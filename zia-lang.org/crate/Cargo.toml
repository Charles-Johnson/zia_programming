[package]
version = "0.1.0"
name = "webzia"
repository = "https://github.com/Charles-Johnson/zia_programming"
authors = ["Charles Johnson <charlesthomasjohnson0@gmail.com>, Martin Kavík <martin@kavik.cz>"]
description = "Website to demonstrate Zia programming"
categories = ["wasm", "rust", "tailwindcss", "seed", "website"]
license = "MIT"
readme = "./README.md"
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dev-dependencies]
wasm-bindgen-test = "=0.3.18"
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
simple_logger = "1.15.0"

[dependencies]
zia = { path = "../../zia", version = "0.6.0"}
seed = "0.9.0"
console_error_panic_hook = "0.1.7"

[dependencies.web-sys]
version = "^0.3.45"
features = [
  "KeyboardEvent",
  "HtmlDivElement"
]

[profile.release]
lto = true
opt-level = 's'
strip = true
